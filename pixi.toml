[workspace]
channels = ["conda-forge"]
name = "MTCargo_analysis"
platforms = ['osx-arm64', "linux-64"]
version = "0.1.0"

[tasks]
RDF = "sh -c 'for dir in /Volumes/data/Sasaki/MTsingleBeads/beads20um/*/*; do echo \"Processing $(basename \\\"$dir\\\")...\"; python libs/RDF.py \"$dir\" --cargo_radius 10; done'"

# Polar order tasks
polar = "python run_batch_analysis.py --mode polar"
polar_all = "python run_batch_analysis.py --mode polar --beads all"
polar_06um = "python run_batch_analysis.py --mode polar --beads beads06um"
polar_1um = "python run_batch_analysis.py --mode polar --beads beads1um"
polar_3um = "python run_batch_analysis.py --mode polar --beads beads3um"
polar_5um = "python run_batch_analysis.py --mode polar --beads beads5um"
polar_7um = "python run_batch_analysis.py --mode polar --beads beads7um"
polar_20um = "python run_batch_analysis.py --mode polar --beads beads20um"

# Angular spatial correlation tasks
corr = "python run_batch_analysis.py --mode corr"
corr_all = "python run_batch_analysis.py --mode corr --beads all"
corr_06um = "python run_batch_analysis.py --mode corr --beads beads06um"
corr_1um = "python run_batch_analysis.py --mode corr --beads beads1um"
corr_3um = "python run_batch_analysis.py --mode corr --beads beads3um"
corr_5um = "python run_batch_analysis.py --mode corr --beads beads5um"
corr_7um = "python run_batch_analysis.py --mode corr --beads beads7um"
corr_20um = "python run_batch_analysis.py --mode corr --beads beads20um"

# Combined analysis task (both polar order & correlation)
analyze_all = "python run_batch_analysis.py --mode all --beads all"

# Plotting & summary tasks
plot_corr = "python angular_correlation.py"
plot_polar = "python local_polar.py"
msd = "python MSD.py"
displacement = "python displacement_analysis.py"
displacement_all = "python displacement_analysis.py --component all"
angle_pdf = "python angle_change_analysis.py"
angle_pdf_abs = "python angle_change_analysis.py --abs"
speed_vs_angle = "python speed_vs_angle_analysis.py"
vacf = "python vacf_analysis.py"
vacf_all = "python vacf_analysis.py --mode all"
ergodicity = "python ergodicity_analysis.py"
ergodicity_all = "python ergodicity_analysis.py --component 2d"
ngp = "python ngp_analysis.py"
ngp_all = "python ngp_analysis.py --component 2d"
run_tumble = "python run_tumble_analysis.py"
hmm = "python hmm_cargo_analysis.py"
hmm_k3 = "python hmm_cargo_analysis.py --n_components 3"
hmm_bic = "python hmm_cargo_analysis.py --eval_bic"
hmm_spatial_corr = "python hmm_spatial_correlation_analysis.py"
hmm_flow_corr = "python hmm_flow_correlation_analysis.py"
hmm_polar = "python hmm_polar_order_analysis.py"



[dependencies]
python = "3.11.*"
numpy = ">=2.3.5,<3"
scipy = ">=1.17.0,<2"
pandas = ">=3.0.0,<4"
matplotlib = ">=3.10.8,<4"
trackpy = ">=0.7,<0.8"
scikit-image = ">=0.26.0,<0.27"
opencv = ">=4.13.0,<5"
numba = ">=0.64.0,<0.65"
jupyterlab = ">=4.5.3,<5"
ipympl = ">=0.10.0,<0.11"
tqdm = ">=4.67.2,<5"
ipykernel = ">=7.1.0,<8"
pip = ">=26.0,<27"
pyfftw = ">=0.15.1,<0.16"
zarr = ">=3.1.5,<4"
h5py = ">=3.16.0,<4"
xarray = ">=2026.2.0,<2027"
hmmlearn = ">=0.3.3,<0.4"
